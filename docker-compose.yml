version: '3.8'

services:
  # MySQL 数据库
  chengyan-mysql:
    image: mysql:8.0
    container_name: chengyan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-chengyan_operation}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/backups:/docker-entrypoint-initdb.d
    networks:
      - chengyan-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 Node.js API
  chengyan-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chengyan-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: chengyan-mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-chengyan_operation}
      JWT_SECRET: ${JWT_SECRET:-chengyan_operation_jwt_secret_2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${API_PORT:-3001}:3000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      chengyan-mysql:
        condition: service_healthy
    networks:
      - chengyan-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端 Nginx
  chengyan-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chengyan-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - chengyan-api
    networks:
      - chengyan-network

volumes:
  mysql_data:
    driver: local
  api_uploads:
    driver: local

networks:
  chengyan-network:
    driver: bridge
